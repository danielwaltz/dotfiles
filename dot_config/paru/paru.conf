# Route paru's sudo calls through the dotfiles askpass shim so the password
# comes from the Proton Pass vault instead of a terminal prompt.
#
# The shim (private_dot_local/bin/executable_sudo-askpass-shim) is installed
# at ~/.local/bin/sudo-askpass-shim, which is on PATH. Set Sudo to the bare
# name for PATH lookup, or an absolute path, if the helper does not find it.
[bin]
Sudo = sudo-askpass-shim
